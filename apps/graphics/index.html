<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LiveCG Output</title>
<style>
  /* 输出画布固定 1920x1080、透明背景，直接作为 Browser Source / HTML Producer 叠加 */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "HarmonyOS Sans SC", "Noto Sans SC", system-ui, sans-serif; }
  body.preview { background: repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0 / 40px 40px; }
  .layer { position: absolute; inset: 0; opacity: 0; transform: translateY(24px); transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
  .layer.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { connect } from "./lib/livecg-client.js";

  // ?preview 显示棋盘格背景；?layers=scorebug,lt 只渲染指定图层（多路输出/分层键控）
  const params = new URLSearchParams(location.search);
  if (params.has("preview")) document.body.classList.add("preview");
  const only = params.get("layers")?.split(",");

  const stage = document.getElementById("stage");
  /** layer → { el, tpl, ctx } */
  const live = new Map();
  const templates = new Map();
  /** 模板导出 css 字符串，首次加载时注入一次 */
  const loadTemplate = (name) => {
    if (!templates.has(name)) {
      templates.set(name, import(`./templates/${name}.js`).then((m) => {
        const tpl = m.default;
        if (tpl.css) document.head.appendChild(Object.assign(document.createElement("style"), { textContent: tpl.css }));
        return tpl;
      }));
    }
    return templates.get(name);
  };

  // 比赛时钟：用本机收到数据的时刻做插值，避免服务器与播出机时钟不一致
  let clockRef = { key: "", localAt: 0 };
  const clockMs = (clock) => {
    if (!clock) return undefined;
    if (!clock.running) return clock.ms;
    const d = Date.now() - clockRef.localAt;
    return clock.direction === "down" ? Math.max(0, clock.ms - d) : clock.ms + d;
  };

  connect({
    role: "graphics",
    async onState(state) {
      const c = state.match.clock;
      const key = c ? `${c.ms}|${c.updatedAt}|${c.running}` : "";
      if (key !== clockRef.key) clockRef = { key, localAt: Date.now() };

      for (const layer of Object.values(state.layers)) {
        if (only && !only.includes(layer.layer)) continue;
        let entry = live.get(layer.layer);
        if (!entry) {
          const el = Object.assign(document.createElement("div"), { className: "layer" });
          el.dataset.layer = layer.layer;
          stage.appendChild(el);
          entry = { el };
          live.set(layer.layer, entry);
        }
        // 已下屏的图层不再渲染：保留最后画面完成淡出，也省掉高频数据的开销
        if (!layer.visible) {
          entry.el.classList.remove("on");
          continue;
        }
        try {
          const tpl = await loadTemplate(layer.template);
          if (entry.tpl !== tpl) {
            entry.el.replaceChildren();
            entry.tpl = tpl;
          }
          entry.ctx = { match: state.match, data: layer.data, state, clockMs: () => clockMs(state.match.clock) };
          tpl.render(entry.el, entry.ctx);
          tpl.tick?.(entry.el, entry.ctx);
        } catch (err) {
          console.error(`template "${layer.template}" failed`, err);
          continue;
        }
        requestAnimationFrame(() => entry.el.classList.add("on"));
      }
    },
  });

  // 逐帧钩子：时钟、限时淡出等不依赖推送的动画
  const loop = () => {
    for (const { el, tpl, ctx } of live.values()) {
      if (ctx && el.classList.contains("on")) {
        try { tpl.tick?.(el, ctx); } catch (err) { console.error(err); }
      }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
</script>
</body>
</html>
