<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveCG 房间</title>
<style>
  :root { color-scheme: dark; --bg: #14161a; --panel: #1d2026; --panel-2: #23272e; --line: #2c313a; --text: #e8eaed; --muted: #9aa0a6;
    --accent: #2f6bff; --live: #e5484d; --ok: #3fb950; --warn: #d29922; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans SC", sans-serif; }
  header { display: flex; align-items: center; gap: 4px 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 600px) { main { padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  form.create { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
  @media (max-width: 760px) { form.create { grid-template-columns: minmax(0, 1fr); } }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; min-width: 0; }
  input, select { background: #0f1115; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; min-width: 0; }
  button, a.btn { background: #2a2f38; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button:hover, a.btn:hover { border-color: #4a5160; }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
  .danger { color: #ff9b9b; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  #rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
  .room { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .room.live { border-color: var(--live); }
  .room-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .room-head b { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-head code { color: var(--muted); font-size: 12px; }
  .score { font-size: 15px; font-variant-numeric: tabular-nums; }
  .score .muted { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--panel-2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .chip.live { background: var(--live); color: #fff; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--live); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .grow { flex: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .urls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; margin-top: 8px; font-size: 12px; }
  .urls span { color: var(--muted); white-space: nowrap; }
  .urls input { font-family: ui-monospace, monospace; font-size: 12px; padding: 4px 6px; }
  .urls button { padding: 2px 8px; font-size: 12px; }
  #toast { position: fixed; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); background: #3a1d1f; border: 1px solid var(--live); color: #ffd6d6; padding: 10px 14px; border-radius: 8px; display: none; z-index: 20; }
  #toast.ok { background: #16301f; border-color: var(--ok); color: #c8f2d4; }
</style>
</head>
<body>
<header><h1>LiveCG 房间</h1><span class="hint" style="margin:0">每个房间是一场独立的赛事：独立的比分、播出单、输出地址和数据接入</span></header>
<main>
  <section>
    <h2>新建房间</h2>
    <form class="create" id="createForm" autocomplete="off">
      <label>名称<input name="name" required maxlength="40" placeholder="例如 二号场 · 女篮半决赛"></label>
      <label>标识（可选，用于网址）<input name="id" maxlength="32" pattern="[a-z0-9][a-z0-9\-]{0,31}" placeholder="court-2"></label>
      <label>复制设置<select name="copyFrom"><option value="">不复制（空白房间）</option></select></label>
      <button type="submit" class="primary">创建</button>
    </form>
    <p class="hint">「复制设置」会复制播出单、队伍资料和各项配置；CasparCG 和计分器连接会被关闭，以免和原房间抢同一个输出层或端口。</p>
  </section>
  <div id="rooms" aria-live="polite"></div>
</main>
<div id="toast" role="alert"></div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const SPORT = { cs2: "CS2", football: "足球", basketball: "篮球", generic: "通用" };
  const DEV = {
    disabled: ["", "未启用"], connecting: ["warn", "连接中"], connected: ["ok", "已连接"], error: ["err", "错误"],
    listening: ["warn", "等待数据"], receiving: ["ok", "接收中"], stale: ["err", "掉线"],
  };
  let toastTimer;
  const toast = (msg, ok = false) => {
    $("toast").textContent = msg;
    $("toast").className = ok ? "ok" : "";
    $("toast").style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ($("toast").style.display = "none"), 4000);
  };
  const api = async (url, method = "GET", body) => {
    const r = await fetch(url, { method, ...(body ? { body: JSON.stringify(body) } : {}) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  };

  let rooms = [];
  let sig = "";
  const openDetails = new Set();

  function card(r) {
    const origin = location.origin;
    const q = encodeURIComponent(r.id);
    const cs2Age = r.cs2LastFrameAt ? (Date.now() - r.cs2LastFrameAt) / 1000 : Infinity;
    const dev = (label, status) => {
      const [cls, text] = DEV[status] ?? ["", status];
      return status === "disabled" ? "" : `<span class="chip"><span class="dot ${cls}"></span>${label} ${text}</span>`;
    };
    const urls = [
      ["控制台", `${origin}/control/?room=${q}`],
      ["PGM 输出", `${origin}/graphics/?room=${q}&channel=pgm`],
      ["PVW 输出", `${origin}/graphics/?room=${q}&channel=pvw`],
      ["CS2 GSI", `${origin}/gsi/cs2/${q}`],
      ["指令 API", `${origin}/api/rooms/${q}/command`],
    ];
    return `
      <article class="room ${r.onAir ? "live" : ""}" data-id="${esc(r.id)}">
        <div class="room-head"><b>${esc(r.name)}</b><code>${esc(r.id)}</code></div>
        <div class="score">${esc(r.home.name)} <b>${r.home.score}</b> <span class="muted">:</span> <b>${r.away.score}</b> ${esc(r.away.name)}
          <span class="muted">· ${esc(SPORT[r.sport] ?? r.sport)}${r.period ? ` · ${esc(r.period)}` : ""}</span></div>
        <div class="chips">
          ${r.onAir ? `<span class="chip live">PGM 在播 ${r.onAir}</span>` : '<span class="chip">PGM 无图文</span>'}
          <span class="chip">控制台 ${r.clients.control} · 输出页 ${r.clients.graphics}</span>
          ${dev("CasparCG", r.casparcg)}${dev("计分器", r.scoreboard)}
          ${cs2Age < 15 ? '<span class="chip"><span class="dot ok"></span>CS2 数据</span>' : ""}
        </div>
        <div class="actions">
          <a class="btn primary" href="/control/?room=${q}">打开控制台</a>
          <span class="grow"></span>
          <button data-act="rename">改名</button>
          ${r.id === "default" ? "" : `<button data-act="delete" class="danger" ${r.onAir ? 'disabled title="请先在控制台全部下屏"' : ""}>删除</button>`}
        </div>
        <details ${openDetails.has(r.id) ? "open" : ""}>
          <summary>地址（输出页 / 数据接入）</summary>
          <div class="urls">${urls.map(([label, u]) => `<span>${label}</span><input readonly value="${esc(u)}" aria-label="${label}"><button data-copy="${esc(u)}">复制</button>`).join("")}</div>
        </details>
      </article>`;
  }

  async function refresh() {
    try {
      rooms = await api("/api/rooms");
    } catch (err) {
      return toast(`无法获取房间列表：${err.message}`);
    }
    // 只有内容变化才重绘，避免轮询打断点击、展开状态和文本选择
    const next = JSON.stringify(rooms.map((r) => ({ ...r, cs2: r.cs2LastFrameAt && Date.now() - r.cs2LastFrameAt < 15000 })).map(({ cs2LastFrameAt, ...r }) => r));
    if (next === sig) return;
    sig = next;
    $("rooms").innerHTML = rooms.map(card).join("");
    const sel = $("createForm").elements.copyFrom;
    const keep = sel.value;
    sel.innerHTML = `<option value="">不复制（空白房间）</option>` + rooms.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
    sel.value = rooms.some((r) => r.id === keep) ? keep : "";
  }

  $("rooms").addEventListener("toggle", (e) => {
    const id = e.target.closest("[data-id]")?.dataset.id;
    if (id) e.target.open ? openDetails.add(id) : openDetails.delete(id);
  }, true);
  $("rooms").addEventListener("focusin", (e) => { if (e.target.matches(".urls input")) e.target.select(); });

  $("rooms").addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const id = btn.closest("[data-id]").dataset.id;
    const room = rooms.find((r) => r.id === id);
    try {
      if (btn.dataset.copy) {
        await navigator.clipboard.writeText(btn.dataset.copy);
        toast("已复制", true);
      } else if (btn.dataset.act === "rename") {
        const name = prompt("新的房间名称", room.name);
        // 取消、留空或没改动都视为不改名，不发请求
        if (name === null || !name.trim() || name.trim() === room.name) return;
        await api(`/api/rooms/${encodeURIComponent(id)}`, "PATCH", { name: name.trim() });
        toast("已改名", true);
      } else if (btn.dataset.act === "delete") {
        if (!confirm(`删除房间「${room.name}」？\n\n房间的数据文件会保留为 .deleted 备份，但该房间的输出页、CasparCG 输出和数据接入会立即停止。`)) return;
        await api(`/api/rooms/${encodeURIComponent(id)}`, "DELETE");
        toast("已删除", true);
      }
    } catch (err) {
      toast(btn.dataset.copy ? "复制失败，请手动选中地址复制" : err.message);
    }
    sig = "";
    refresh();
  });

  $("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    try {
      const room = await api("/api/rooms", "POST", { name: f.name.value, ...(f.id.value.trim() ? { id: f.id.value.trim() } : {}), ...(f.copyFrom.value ? { copyFrom: f.copyFrom.value } : {}) });
      toast(`已创建「${room.name}」`, true);
      e.target.reset();
      sig = "";
      refresh();
    } catch (err) {
      toast(err.message);
    }
  });

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
